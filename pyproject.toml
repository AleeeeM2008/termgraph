[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "termgraph"
version = "0.1.4"
description = "A certified glassbox exchange architecture for tabular models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Patricio Alejandro Mery Caro", email = "pmery641@gmail.com" },
]
keywords = ["glassbox", "explainable-ai", "ebm", "shap", "xgboost", "tabular"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "interpret>=0.6",
    "joblib>=1.3",
]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8", "scikit-learn>=1.3"]
all = [
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    "interpret>=0.6",
    "joblib>=1.3",
    "matplotlib>=3.7",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
